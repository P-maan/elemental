<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elemental Settings</title>
<style>
  :root{color-scheme:dark;--bg:#0d0f14;--card:#161a22;--line:#262c38;--fg:#e8ebf1;--mut:#8a93a6;--acc:#7aa7ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
  main{max-width:520px;margin:0 auto;padding:20px 16px 80px}
  h1{font-size:20px;font-weight:600;margin:0 0 16px}
  fieldset{border:1px solid var(--line);background:var(--card);border-radius:10px;margin:0 0 14px;padding:10px 14px}
  legend{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:0 6px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  label{flex:1}
  input[type=number],select{width:150px;background:#0f1218;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
  input[type=range]{width:150px}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
  .bar span{flex:1;color:var(--mut);font-size:12px}
  button{background:#232a37;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer}
  button.pri{background:var(--acc);border-color:var(--acc);color:#081022;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Elemental</h1>
  <form id="f">
    <fieldset><legend>Location</legend>
      <div class="row"><label for="lat">Latitude</label><input id="lat" type="number" step="0.0001" min="-90" max="90"></div>
      <div class="row"><label for="lon">Longitude</label><input id="lon" type="number" step="0.0001" min="-180" max="180"></div>
      <div class="row"><label>Find automatically</label><button type="button" id="geo">Use my location</button></div>
    </fieldset>
    <fieldset><legend>Look</legend>
      <div class="row"><label for="style">Style</label><select id="style"><option value="glass">Glass tiles</option><option value="dots">Dots</option></select></div>
      <div class="row"><label for="material">Tile material</label><select id="material"><option>classic</option><option>glass</option><option>metal</option><option>plastic</option><option>matte</option></select></div>
      <div class="row"><label for="gridRows">Grid rows</label><input id="gridRows" type="number" min="12" max="200" step="1"></div>
      <div class="row"><label for="starBrightness">Star brightness</label><input id="starBrightness" type="range" min="0" max="1" step="0.05"></div>
    </fieldset>
    <fieldset><legend>Sky</legend>
      <div class="row"><label for="planets">Planets</label><input id="planets" type="checkbox"></div>
      <div class="row"><label for="leaves">Autumn leaves</label><input id="leaves" type="checkbox"></div>
      <div class="row"><label for="festivals">Festivals</label><input id="festivals" type="checkbox"></div>
    </fieldset>
    <fieldset><legend>Performance</legend>
      <div class="row"><label for="maxFps">Max frame rate</label><select id="maxFps"><option>15</option><option>24</option><option>30</option><option>60</option></select></div>
      <div class="row"><label for="paused">Paused</label><input id="paused" type="checkbox"></div>
    </fieldset>
  </form>
</main>
<div class="bar"><span id="msg"></span><button type="button" id="reset">Defaults</button><button type="button" class="pri" id="save">Apply</button></div>
<script>
/* Host contract (WebView2): the host injects window.ELEMENTAL_SETTINGS before load (or posts
   {type:"elemental-settings", settings} later). Apply posts {type:"elemental-settings", settings}
   back through window.chrome.webview.postMessage. Without a host it saves to localStorage. */
const DEF={lat:51.4779,lon:-0.0015,style:"glass",material:"glass",gridRows:54,starBrightness:0.5,planets:true,leaves:true,festivals:true,maxFps:30,paused:false};
const F=["lat","lon","style","material","gridRows","starBrightness","planets","leaves","festivals","maxFps","paused"];
const host=window.chrome&&window.chrome.webview;
const $=id=>document.getElementById(id);
function load(s){ s=Object.assign({},DEF,s||{});
  for(const k of F){ const el=$(k); if(el.type==="checkbox") el.checked=!!s[k]; else el.value=s[k]; } }
function read(){ const o={};
  for(const k of F){ const el=$(k);
    if(el.type==="checkbox") o[k]=el.checked;
    else if(el.type==="number"||el.type==="range"||k==="maxFps") o[k]=parseFloat(el.value);
    else o[k]=el.value; }
  if(!isFinite(o.lat)) delete o.lat; if(!isFinite(o.lon)) delete o.lon;
  return o; }
function say(t){ $("msg").textContent=t; clearTimeout(say.t); say.t=setTimeout(()=>$("msg").textContent="",2500); }
let init=window.ELEMENTAL_SETTINGS;
if(!init){ try{ init=JSON.parse(localStorage.getItem("elementalSettings")||"null"); }catch(_){} }
load(init);
if(host){ host.addEventListener("message",e=>{ const d=e.data; if(d&&d.type==="elemental-settings"&&d.settings) load(d.settings); }); }
$("save").onclick=()=>{ const s=read(); window.ELEMENTAL_SETTINGS=s;
  if(host){ host.postMessage({type:"elemental-settings",settings:s}); say("Applied"); }
  else { try{ localStorage.setItem("elementalSettings",JSON.stringify(s)); }catch(_){} say("Saved in this browser"); } };
$("reset").onclick=()=>{ load(DEF); say("Defaults loaded, press Apply"); };
$("geo").onclick=()=>{ if(!navigator.geolocation){ say("Location not available"); return; }
  say("Finding you..."); navigator.geolocation.getCurrentPosition(p=>{ $("lat").value=p.coords.latitude.toFixed(4); $("lon").value=p.coords.longitude.toFixed(4); say("Found, press Apply"); }, ()=>say("Location refused"), {timeout:10000}); };
</script>
</body>
</html>
